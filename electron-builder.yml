appId: com.claudeliteSpeaker.trayapp
productName: Claude Lite Speaker

directories:
  output: out

files:
  - "**/*"
  - "!data${/*}"
  - "!frontend-src${/*}"
  - "!pnpm-workspace.yaml"
  - "!inkspaceLogo.svg"
  - "!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})${/*}"
  - "!node_modules/**/*{darwin,win32,linux}*.node"
  - "node_modules/**/*${platform}*.node"
  - "!node_modules/**/*arm*.node"
  - "!node_modules/onnxruntime-node/bin/napi-v6/*/arm64${/*}"
  - "!node_modules/onnxruntime-node/bin/napi-v6/**/*providers_cuda*"
  - "!node_modules/onnxruntime-node/bin/napi-v6/**/*providers_tensorrt*"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/onnxruntime-node/bin/**"
  - "**/@echogarden/espeak-ng-emscripten/**"

publish:
  - provider: github
    owner: abdedarghal111
    repo: claude-lite-speaker-mcp
    releaseType: release

win:
  target: nsis
  icon: res/icons/appIcon.ico
  artifactName: "${productName}-${version}-win-setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  icon: res/icons/appIcon.png
  category: public.app-category.utilities
  identity: null
  artifactName: "${productName}-${version}-mac.${ext}"

linux:
  target: deb
  icon: res/icons/appIcon.png
  executableName: claude-lite-speaker
  category: Utility
  artifactName: "${productName}-${version}-linux.${ext}"
