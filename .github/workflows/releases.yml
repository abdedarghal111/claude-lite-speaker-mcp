name: Release new version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and release
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            pnpm run build:linux --publish always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            pnpm run build:mac --publish always
          fi

  windows:
    runs-on: windows-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and release
        run: pnpm run build:win --publish always

  create-release-publication:
    runs-on: ubuntu-24.04
    needs: [unix, windows]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Set release title
        uses: joutvhu/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Claude Lite Speaker ${{ github.ref_name }}'
          body: 'Auto-generated release for ${{ github.ref_name }}'
          draft: false
          prerelease: false
